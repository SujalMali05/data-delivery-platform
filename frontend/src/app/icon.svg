<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  
  <!-- Outer smooth rounded squircle frame -->
  <rect width="32" height="32" rx="9" fill="url(#primary-grad)" />

  <!-- Left Source database cylinders -->
  <g fill="#ffffff" opacity="0.95">
    <ellipse cx="10" cy="12" rx="4" ry="1.5" />
    <path d="M6,12 L6,16 C6,16.8 7.8,17.5 10,17.5 C12.2,17.5 14,16.8 14,16 L14,12 Z" opacity="0.75" />
    <path d="M6,16 L6,20 C6,20.8 7.8,21.5 10,21.5 C12.2,21.5 14,20.8 14,20 L14,16 Z" opacity="0.5" />
  </g>

  <!-- Right Destination S3 bucket/cloud symbol -->
  <g fill="#ffffff" opacity="0.95">
    <ellipse cx="22" cy="12" rx="4" ry="1.5" />
    <path d="M18,12 L18,16 C18,16.8 19.8,17.5 22,17.5 C24.2,17.5 26,16.8 26,16 L26,12 Z" opacity="0.75" />
    <path d="M18,16 L18,20 C18,20.8 19.8,21.5 22,21.5 C24.2,21.5 26,20.8 26,20 L26,16 Z" opacity="0.5" />
  </g>

  <!-- Transfer/Bridge Arch Linking Left & Right -->
  <path d="M10,9 C12,5 20,5 22,9" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.9" />
  
  <!-- Mini arrow on the bridge pointing to destination -->
  <polygon points="21.5,6.5 23.5,9.2 20.5,9" fill="#ffffff" />
</svg>
